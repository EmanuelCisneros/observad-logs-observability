# Prometheus scrape config for the Observa stack. The backend exposes its
# internal metrics at /metrics — yes, we use a metrics system to observe our
# observability platform.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: observa-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8080"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
